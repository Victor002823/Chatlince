name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_CHATWOOT_BASE_URL: https://chat.mudanzasellince.com
      EXPO_PUBLIC_MINIMUM_CHATWOOT_VERSION: 4.1.0
      EXPO_PUBLIC_PROJECT_ID: 3597b2c4-6ff1-4274-bb9c-5b1911fd8379
      EXPO_PUBLIC_ANDROID_GOOGLE_SERVICES_FILE: ./google-services.json
      EXPO_PUBLIC_IOS_GOOGLE_SERVICES_FILE: ./GoogleService-Info.plist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Write google-services.json and unignore it
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          sed -i '/^google-services\.json/s/^/#/' .gitignore
          sed -i '/^GoogleService-Info\.plist/s/^/#/' .gitignore
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f google-services.json android/app/google-services.json .gitignore
          git commit -m "temp: include google-services.json for build" --allow-empty

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: 1
        run: eas build --platform android --profile preview --local --output=chat-lince.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-lince-apk
          path: chat-lince.apk
